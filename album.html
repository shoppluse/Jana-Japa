<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>Marathon Album — Live Moments</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <header class="app-header">
    <h1>Chanting Album</h1>
    <p class="subtitle">Live moments from all teams</p>
  </header>

  <main class="container">
    <!-- Upload Card -->
    <section class="card upload-card">
      <h3>Share a Photo</h3>
      <div class="upload-controls">
        <select id="album-team-select" class="select-input">
          <option value="A">Team A</option>
          <option value="B">Team B</option>
          <option value="C">Team C</option>
          <option value="D">Team D</option>
          <option value="E">Team E</option>
          <option value="F">Team F</option>
        </select>

        <div class="action-pair">
          <label for="camera-input" class="media-btn" title="Capture Photo" aria-label="Capture Photo">
            <span>📸</span>
            <input type="file" id="camera-input" accept="image/*" capture="environment" hidden />
          </label>

          <label for="photo-input" class="media-btn" title="Upload Photo" aria-label="Upload Photo">
            <span>📁</span>
            <input type="file" id="photo-input" accept="image/*" hidden />
          </label>
        </div>
      </div>
      <p id="upload-status" class="status-text"></p>
    </section>

    <!-- Live Photo Feed -->
    <section class="album-grid" id="album-grid">
      <p class="empty-state">Loading photos...</p>
    </section>
  </main>

  <!-- Full-Screen Photo Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-top">
      <span id="lightbox-counter" class="lightbox-counter">1 / 1</span>
      <div class="lightbox-actions">
        <button id="lightbox-info-btn" class="lb-icon-btn" aria-label="Photo Info" title="Details">ⓘ</button>
        <button id="lightbox-close-btn" class="lb-icon-btn" aria-label="Close" title="Close">&times;</button>
      </div>
    </div>

    <div class="lightbox-stage" id="lightbox-stage">
      <button id="lightbox-prev" class="lb-nav-btn lb-prev" aria-label="Previous">&#10094;</button>
      <img id="lightbox-img" src="" alt="Chanting moment" />
      <button id="lightbox-next" class="lb-nav-btn lb-next" aria-label="Next">&#10095;</button>
    </div>

    <!-- Info Drawer (Toggled by Info Button) -->
    <div id="lightbox-info-panel" class="lightbox-info-panel hidden">
      <div class="info-row">
        <span class="info-label">Uploaded By</span>
        <span id="info-team" class="info-value highlight">Team A</span>
      </div>
      <div class="info-row">
        <span class="info-label">Date</span>
        <span id="info-date" class="info-value">--</span>
      </div>
      <div class="info-row">
        <span class="info-label">Time</span>
        <span id="info-time" class="info-value">--</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden">Photo uploaded!</div>

  <!-- Fixed Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html#add" class="nav-btn accent-btn">
      <span class="nav-icon">+</span>
      <span class="nav-text">Count</span>
    </a>
    <a href="index.html" class="nav-btn">
      <span class="nav-icon">⌂</span>
      <span class="nav-text">Home</span>
    </a>
    <a href="album.html" class="nav-btn active">
      <span class="nav-icon">▣</span>
      <span class="nav-text">Album</span>
    </a>
  </nav>

  <script type="module" src="app.js?v=5"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
